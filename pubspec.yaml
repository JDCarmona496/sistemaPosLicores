name: applicoresestacion
description: "Sistema de gestión para licorería - Multiplataforma"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Backend - Supabase
  supabase_flutter: ^2.8.4

  # Local Database (Offline-first)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28

  # Navigation
  go_router: ^14.8.1

  # Impresión térmica ESC/POS (móvil / USB nativo / Bluetooth)
  flutter_thermal_printer: ^0.0.9
  flutter_blue_plus: ^1.34.5
  esc_pos_utils_plus: ^2.0.4

  # Puerto serial Windows (COM) para impresoras térmicas
  serial_port_win32: ^2.3.0

  # Impresión nativa de Windows / PDF
  printing: ^5.13.0
  pdf: ^3.10.0

  # Escaneo de códigos de barras
  mobile_scanner: ^7.4.0

  # Gráficos y reportes
  fl_chart: ^1.2.0

  # UI Components
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Formularios y validación
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.6.1

  # Utilidades
  intl: ^0.19.0
  uuid: ^4.5.1
  equatable: ^2.0.7
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  dartz: ^0.10.1
  http: ^1.2.2

  # Geolocalización (para domiciliarios)
  geolocator: ^13.0.2
  url_launcher: ^6.3.1

  # Captura de evidencia de entrega (foto) y logo del negocio
  image_picker: ^1.1.2
  image: ^4.5.2

  # Notificaciones
  flutter_local_notifications: ^18.0.1

  # Permisos
  permission_handler: ^11.3.1

  # Storage local
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

  # Code Generation
  build_runner: ^2.5.4
  build_resolvers: ^2.5.4
  freezed: ^2.5.8
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.4
  drift_dev: ^2.22.1

dependency_overrides:
  analyzer: ^7.7.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
